<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f0df">
  <title>最后一件装得下吗</title>
  <link rel="stylesheet" href="./styles.css?v=progress-10">
  <script type="module" src="./game.mjs?v=progress-10"></script>
</head>
<body>
  <div class="camp-landscape" aria-hidden="true">
    <span class="camp-sun"></span>
    <span class="camp-ridge ridge-distant"></span>
    <span class="camp-ridge ridge-near"></span>
    <span class="camp-trees trees-left"></span>
    <span class="camp-trees trees-right"></span>
  </div>
  <main class="game">
    <header class="game-header">
      <span class="package-mark" aria-hidden="true"><i></i></span>
      <h1>最后一件装得下吗<span aria-hidden="true">？</span></h1>
      <button type="button" id="camp-sound" data-enabled="true" aria-label="声音设置"
        aria-haspopup="dialog" aria-controls="sound-settings" aria-expanded="false">
        <span class="sound-icon" aria-hidden="true"></span><span>声音</span>
      </button>
    </header>

    <nav class="level-nav" aria-label="关卡导航">
      <button type="button" id="previous-stage" class="level-tab level-arrow" aria-label="上一关" disabled>‹</button>
      <button type="button" id="open-level-chooser" class="level-tab level-picker" aria-haspopup="dialog"
        aria-controls="level-chooser" aria-expanded="false">
        <span id="level-number">第 1 关</span><span id="level-total"></span><span class="picker-label">选关</span>
      </button>
      <button type="button" id="next-stage" class="level-tab level-arrow" aria-label="下一关" disabled>›</button>
    </nav>

    <div class="game-layout">
      <section class="mission" aria-labelledby="level-title">
        <div class="mission-reference" aria-hidden="true"></div>
        <div class="mission-copy">
          <div class="mission-heading"><h2 id="level-title"></h2><span id="difficulty" hidden></span></div>
          <p id="objective"></p>
        </div>
        <p id="progress" class="progress"></p>
      </section>

      <section class="load-bed" aria-labelledby="vehicle-label">
        <div class="load-bed-head">
          <span id="vehicle-label">后备厢</span>
          <span id="board-size">5 × 5</span>
        </div>
        <div class="load-bed-frame">
          <div id="grid" aria-label="装箱区" aria-describedby="instruction">
            <div id="cells"></div>
            <div id="tutorial-targets" class="board-targets" aria-hidden="true"></div>
            <div id="placed"></div>
            <div id="assist-targets" class="board-targets" aria-hidden="true"></div>
            <section id="tutorial" class="tutorial" aria-label="新手引导" hidden>
              <div class="tutorial-copy" aria-live="polite">
                <div class="tutorial-heading"><span>新手引导</span><span id="tutorial-progress"></span></div>
                <p><strong id="tutorial-title"></strong><span id="tutorial-text"></span></p>
              </div>
              <div class="tutorial-actions">
                <button type="button" id="tutorial-next">下一步</button>
                <button type="button" id="tutorial-skip">跳过</button>
              </div>
            </section>
            <div id="camp-hatch" aria-hidden="true">
              <div class="hatch-window"></div>
              <div class="hatch-handle"></div>
            </div>
          </div>
          <div class="door-indicator">车门</div>
          <p id="assist-message" class="assist-message" role="status" aria-live="polite" hidden></p>
        </div>
        <div class="load-bed-tail" aria-hidden="true"><i></i><i></i></div>
      </section>

      <section class="cargo" aria-label="货架">
        <div class="cargo-heading">
          <h2>待装货物</h2>
          <button type="button" id="tutorial-open" aria-controls="tutorial" hidden>看引导</button>
          <p id="instruction"></p>
        </div>
        <div id="tray" aria-label="选择货物"></div>
      </section>

      <div class="actions" aria-label="操作">
        <button type="button" id="rotate" class="action action-primary">
          <span class="action-icon icon-rotate" aria-hidden="true"></span><span>旋转</span>
        </button>
        <button type="button" id="undo" class="action">
          <span class="action-icon icon-undo" aria-hidden="true"></span><span>撤回</span>
        </button>
        <button type="button" id="restart" class="action">
          <span class="action-icon icon-restart" aria-hidden="true"></span><span>重开</span>
        </button>
        <button type="button" id="hint" class="action assistance-action" aria-label="提示，剩余 3 次">
          <span class="action-icon icon-hint" aria-hidden="true"></span><span>提示</span>
          <span id="hint-remaining" class="uses-left" aria-hidden="true">3 次</span>
        </button>
        <button type="button" id="auto-place" class="action assistance-action" aria-label="自动摆放，剩余 2 次">
          <span class="action-icon icon-auto-place" aria-hidden="true"></span><span>自动摆放</span>
          <span id="auto-remaining" class="uses-left" aria-hidden="true">2 次</span>
        </button>
      </div>
      <div class="play-feedback">
        <p id="rotation-help" hidden>已装入的货物可以移动，拖回货架后可以旋转。</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>
  <dialog id="win" class="win" aria-labelledby="win-title">
    <span class="package-mark" aria-hidden="true"><i></i></span>
    <h2 id="win-title"></h2>
    <p id="win-text"></p>
    <div class="win-actions">
      <button type="button" id="replay" class="action">再玩一次</button>
      <button type="button" id="next-level" class="action action-primary">下一关</button>
    </div>
  </dialog>
  <dialog id="level-chooser" class="level-chooser" aria-labelledby="level-chooser-title" aria-describedby="level-chooser-help">
    <div class="chooser-head">
      <h2 id="level-chooser-title">选择关卡</h2>
      <button type="button" id="close-level-chooser" class="chooser-close">返回</button>
    </div>
    <p id="level-chooser-help" class="chooser-help">通关后解锁下一关，已通关的可重玩。</p>
    <div class="chapter-bar">
      <label for="chapter-select">章节</label>
      <select id="chapter-select"></select>
      <p id="chapter-progress" aria-live="polite"></p>
    </div>
    <nav id="level-nav" class="level-grid" aria-label="本章关卡"></nav>
  </dialog>
  <dialog id="sound-settings" class="sound-settings" aria-labelledby="sound-title">
    <h2 id="sound-title">声音设置</h2>
    <label class="sound-switch">
      <span>背景音乐与操作音效</span>
      <input type="checkbox" id="sound-enabled" checked>
    </label>
    <div class="sound-volume">
      <label for="sound-volume">音量</label>
      <output id="sound-volume-value" for="sound-volume">75%</output>
      <input type="range" id="sound-volume" min="0" max="100" value="75">
    </div>
    <fieldset class="sound-styles">
      <legend>声音风格</legend>
      <label><input type="radio" name="sound-style" value="camp" checked>露营原声</label>
      <label><input type="radio" name="sound-style" value="bright">轻快</label>
      <label><input type="radio" name="sound-style" value="wood">木质</label>
    </fieldset>
    <button type="button" id="sound-close" class="action action-primary">完成</button>
  </dialog>
  <noscript>请启用 JavaScript 后打开试玩。</noscript>
</body>
</html>
